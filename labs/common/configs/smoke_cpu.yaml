# Tiny model on synthetic data. Runs on a laptop CPU in well under a minute:
#   python -m mygpt.train --config configs/smoke_cpu.yaml
# Loss should fall from ~5.5 (= ln 256) to ~4.3 in 20 steps (more steps -> toward ln 4 = 1.4,
# the data's entropy).
model:
  vocab_size: 256
  n_layer: 2
  n_head: 2
  n_embd: 64
  block_size: 64
  pos_emb: learned
  norm: layernorm
  mlp: gelu
  qk_norm: false
  bias: true
  tie_embeddings: true

train:
  data_dir: synthetic          # generated into out_dir/synthetic_data on first run
  train_tokens: 20480          # 20 steps x 1024 tokens
  total_batch_tokens: 1024     # 8 seqs x 64 tokens x 2 accumulation steps
  micro_batch_size: 8
  seq_len: 64
  lr: 1.0e-2
  min_lr_ratio: 0.1
  warmup_tokens: 2048
  schedule: cosine
  optimizer: adamw
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: fp32
  compile: false
  seed: 1337
  out_dir: runs/smoke_cpu
  run_name: smoke_cpu
  eval_every: 10
  eval_tokens: 2048
  hellaswag_every: 0
  ckpt_every: 10
  keep_last: 2
  ckpt_remote: ""
  wandb_project: ""
  log_every: 5
